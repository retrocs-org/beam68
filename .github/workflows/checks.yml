name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    env:
      BEAM68_SOURCE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP CLI
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli
      - name: Portable tests and bundled manifests
        run: make HOST_CC=gcc host-test
      - name: Memory and undefined behavior checks
        run: make HOST_CC='gcc -fsanitize=address,undefined -fno-omit-frame-pointer -g' host-test
  native:
    # Native binaries are built locally with a licensed NDK/toolchain.
    # This job is opt-in on a maintainer-managed runner; no ROMs are uploaded.
    if: github.event_name == 'workflow_dispatch' && vars.BEAM68_NATIVE_RUNNER == 'enabled'
    runs-on: [self-hosted, amiga-toolchain]
    steps:
      - uses: actions/checkout@v4
      - name: Build all runtime binaries
        run: ./scripts/build-amiga.sh all
      - name: Verify and package
        run: |
          python3 scripts/build-provenance.py verify
          python3 scripts/package-release.py
