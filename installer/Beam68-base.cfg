# Beam68 0.1 -- editable ASCII text. No binary settings files.
# Active file is ENV:Beam68/Beam68.cfg (temporary Use settings).
# Permanent copy is ENVARC:Beam68/Beam68.cfg (Save settings).
# This shipped file is read only as a first-run fallback.
HOTKEY=rawkey control alt space
SCAN_ICONS=YES
SCAN_EXECUTABLES=NO
# Native file/drawer scopes. FILE_PATTERNS accepts comma-separated * and ?.
# Plain files are off by default: on a 68000 they fill MAX_ITEMS quickly and
# can push applications in later drawers (SYS:System) out of the index.
INDEX_FILES=NO
INDEX_DRAWERS=YES
# WHDLoad games: game icons and icon-less .slave files become GAME results
# (add your games drawer as a DIR).  WHDLOAD_COMMAND starts bare slaves.
INDEX_GAMES=YES
WHDLOAD_COMMAND=WHDLoad
# Optional global keys for favorites 1..9, e.g. QUICK_LAUNCH=control alt
# gives Ctrl+Alt+1..9.  Empty = off (Ctrl+1..9 always work in the launcher).
QUICK_LAUNCH=
# Directory Opus: its ARexx port, and whether drawers open in Opus listers
# instead of Workbench windows (only while Opus is running).
DOPUS_PORT=DOPUS.1
OPEN_DRAWERS_IN_DOPUS=NO
# Run plugins from a RAM copy (T:Beam68/PluginCache) - faster on floppy or
# slow CF, costs the plugins' size in RAM.
PLUGIN_CACHE=NO
# List sizes: results kept and scrolled (8-64), entries listed when browsing
# a drawer (16-512), hidden results (1-256), recent documents (1-64).
RESULTS_MAX=32
BROWSE_MAX=128
HIDDEN_MAX=32
RECENT_DOCS=16
# Plugin/theme catalogue index (URL or path) and the download tool used for
# it; {url} and {file} are filled in.  wget is on Aminet (comm/tcp).
CATALOGUE_URL=
# Extra index sources: ARexx scripts in REXX: (script:), music modules in the
# indexed drawers (mod:), HTML bookmark files, ';'-separated (web:), e.g.
# NetSurf's hotlist or an IBrowse/AWeb HTML export.  Snippets come from
# ENVARC:Beam68/Snippets.txt (snip:).  {file}/{url} are filled in.
INDEX_REXX=YES
INDEX_MODULES=NO
BOOKMARK_FILES=
MODULE_COMMAND=Run >NIL: HippoPlayer "{file}"
# A running player gets the module over ARexx instead (no second copy).
MODULE_PORT=HIPPOPLAYER
MODULE_AREXX=LOAD "{file}"
URL_COMMAND=OpenURL "{url}"
DOWNLOAD_COMMAND=wget -q -O "{file}" "{url}"
FILE_PATTERNS=*
# Repeat EXCLUDE_DIR as needed, for example SYS:Trashcan.
HISTORY=YES
# Saves a text cache as Beam68.index next to the launcher (F2 rescans).
INDEX_CACHE=YES
# Explicit shell:<command> execution. Disable if the launcher is shared.
SHELL_COMMANDS=YES
# External plugin execution timeout in seconds, allowed 5..120.
PLUGIN_TIMEOUT=30
# Show a small selected-application icon; NO avoids extra disk I/O on 68000.
ICON_PREVIEW=NO
MAX_DEPTH=4
MAX_ITEMS=512
VISIBLE_RESULTS=6
# Resizable launcher; HEIGHT=0 automatically fits result count.
WINDOW_WIDTH=550
WINDOW_HEIGHT=0
# WORKBENCH, LATTE, FRAPPE, MACCHIATO, MOCHA or CUSTOM.
THEME=WORKBENCH
CUSTOM_COLORS=CDD6F4,585B70,F38BA8,1E1E2E,11111B
# Launcher accessibility and low-resolution layout.
FONT_NAME=topaz.font
FONT_SIZE=8
ROW_SPACING=7
HIGH_CONTRAST=NO
LARGE_GADGETS=NO
REDUCED_COLORS=NO
COMPACT_MODE=AUTO

# Repeat DIR for each directory to search.
DIR=SYS:Tools
DIR=SYS:Utilities
DIR=SYS:Prefs
DIR=SYS:System

# Plugins chosen in the installer follow (PLUGIN=, one per package).

# To disable a plugin without deleting its PLUGIN entry, uncomment:
# PLUGIN_DISABLED=PROGDIR:Plugins/Clock/Clock.plugin

# Favorites are separate editable files in ENV:/ENVARC:Beam68/Favorites.txt.
# Press F6 on an indexed result or use Beam68Prefs -> Favorites.

# Used by SYS:Prefs/Beam68Prefs to locate the separate resident executable.
# Update this if Beam68 is installed outside SYS:Utilities.
INSTALL_DIR=SYS:Utilities/Beam68
